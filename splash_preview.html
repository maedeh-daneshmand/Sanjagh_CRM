<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanjagh splash preview</title>
<style>
  :root { --h: 160; --primary: hsl(var(--h) 84% 36%); --primary-dark: hsl(var(--h) 84% 22%); --primary-soft: hsl(var(--h) 70% 96%); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: var(--primary-soft); overflow: hidden; }
  body.dark { --primary-soft: hsl(var(--h) 30% 8%); color: #eee; }

  /* ---------- login page ---------- */
  .login { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(1200px 700px at 80% -10%, var(--primary), transparent 60%),
                linear-gradient(135deg, var(--primary), var(--primary-dark)); overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35; background: #fff; }
  .b1 { width: 320px; height: 320px; top: -80px; left: -60px; }
  .b2 { width: 260px; height: 260px; bottom: -60px; right: 8%; opacity: .2; }
  .card { position: relative; width: min(400px, 100%); background: rgba(255,255,255,.92); color: #1a1a1a;
    border-radius: 22px; padding: 28px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.25); backdrop-filter: blur(10px); }
  body.dark .card { background: rgba(20,24,22,.85); color: #eee; }
  .mark { direction: ltr; text-align: center; font-weight: 800; letter-spacing: .35em; color: var(--primary); font-size: 14px; }
  h1 { text-align: center; margin: 10px 0 4px; font-size: 22px; }
  p.sub { text-align: center; margin: 0 0 18px; color: #666; font-size: 13px; }
  body.dark p.sub { color: #aaa; }
  label { font-size: 12px; color: #666; }
  input { width: 100%; direction: ltr; text-align: left; padding: 12px 14px; border: 1px solid #ccd; border-radius: 12px; font-size: 16px; margin: 6px 0 14px; background: transparent; color: inherit; }
  input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .btn { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .hint { text-align: center; margin-top: 12px; font-size: 12px; color: #888; }

  /* ---------- palette ---------- */
  .tools { position: fixed; top: 12px; left: 12px; z-index: 50; display: flex; gap: 8px; align-items: center;
    background: rgba(255,255,255,.9); padding: 8px 10px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; box-shadow: 0 0 0 1px #0003; }
  .tools button { border: 0; background: #111; color: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 12px; }

  /* ---------- splash ---------- */
  .splash { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; cursor: pointer;
    background: radial-gradient(900px 600px at 50% 40%, color-mix(in srgb, var(--primary) 100%, #fff 12%), var(--primary-dark)); }
  .splash.out { animation: slideUp .6s cubic-bezier(.7,0,.2,1) forwards; }
  @keyframes slideUp { to { transform: translateY(-100%); } }
  .inner { text-align: center; color: #fff; }
  .pin { width: 44px; height: 44px; margin: 0 auto 14px; opacity: 0; animation: drop .6s cubic-bezier(.2,1.2,.3,1) .1s forwards; }
  @keyframes drop { from { opacity: 0; transform: translateY(-28px) scale(.6) rotate(-20deg); } to { opacity: 1; transform: none; } }
  .word { direction: ltr; display: flex; justify-content: center; gap: .12em; font-weight: 800; font-size: clamp(34px, 9vw, 72px); letter-spacing: .12em; }
  .word span { opacity: 0; transform: translateY(18px); filter: blur(10px); animation: letter .5s ease-out forwards; }
  @keyframes letter { to { opacity: 1; transform: none; filter: blur(0); } }
  .bar { width: min(240px, 60vw); height: 3px; margin: 22px auto 0; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #fff; animation: fill 1.7s ease-out .5s forwards; }
  @keyframes fill { to { width: 100%; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) {
    .word span, .pin { animation: none; opacity: 1; transform: none; filter: none; }
    .bar i { animation: none; width: 100%; }
    .splash.out { animation: none; opacity: 0; transition: opacity .3s; }
  }
</style>
</head>
<body>

<div class="tools" dir="ltr">
  <span class="dot" style="background:hsl(160 84% 36%)" data-h="160"></span>
  <span class="dot" style="background:hsl(217 90% 50%)" data-h="217"></span>
  <span class="dot" style="background:hsl(265 80% 55%)" data-h="265"></span>
  <span class="dot" style="background:hsl(345 80% 52%)" data-h="345"></span>
  <button id="dark">Dark</button>
  <button id="replay">Replay</button>
</div>

<main class="login">
  <div class="blob b1"></div><div class="blob b2"></div>
  <section class="card">
    <div class="mark">SANJAGH</div>
    <h1>ورود به سنجاق</h1>
    <p class="sub">برای ورود شماره موبایل خود را وارد کنید</p>
    <label for="p">شماره موبایل</label>
    <input id="p" inputmode="numeric" placeholder="09xxxxxxxxx">
    <button class="btn">دریافت کد ورود</button>
    <div class="hint">کد ۶ رقمی برای شما پیامک می‌شود · 02:00</div>
  </section>
</main>

<div class="splash" id="splash" role="status">
  <span class="sr">در حال بارگذاری سنجاق</span>
  <div class="inner">
    <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z"/>
    </svg>
    <div class="word" id="word" aria-hidden="true"></div>
    <div class="bar"><i></i></div>
  </div>
</div>

<script>
  const splash = document.getElementById('splash');
  const word = document.getElementById('word');
  let timer;

  function play() {
    clearTimeout(timer);
    splash.classList.remove('out');
    splash.style.display = '';
    word.innerHTML = '';
    'SANJAGH'.split('').forEach((ch, i) => {
      const s = document.createElement('span');
      s.textContent = ch;
      s.style.animationDelay = (0.55 + i * 0.12) + 's';
      word.appendChild(s);
    });
    timer = setTimeout(hide, 2500);
  }
  function hide() {
    clearTimeout(timer);
    splash.classList.add('out');
    setTimeout(() => { splash.style.display = 'none'; }, 650);
  }

  splash.addEventListener('click', hide);
  addEventListener('keydown', hide);
  document.getElementById('replay').onclick = play;
  document.getElementById('dark').onclick = () => document.body.classList.toggle('dark');
  document.querySelectorAll('.dot').forEach(d => d.onclick = () => {
    document.documentElement.style.setProperty('--h', d.dataset.h);
    play();
  });
  play();
</script>
</body>
</html>
